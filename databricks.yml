bundle:
  name: nyc_mobility_pipeline
variables:
  catalog:
    default: nyc_mobility
  bronze_schema:
    default: nyc_bronze
  silver_schema:
    default: nyc_silver
  gold_schema:
    default: nyc_gold
  quality_schema:
    default: nyc_quality
  landing_root:
    description: Volume landing directory for the selected environment
  zone_file:
    default: taxi_zone_lookup.csv
  max_valid_distance_miles:
    default: '100'
targets:
  dev:
    default: true
    mode: development
resources:
  jobs:
    nyc_mobility:
      name: NYC Mobility
      max_concurrent_runs: 1
      tasks:
      - task_key: bronze
        spark_python_task:
          python_file: ./pipeline/01_bronze/bronze_auto_ingest.py
          parameters:
          - --param
          - taxi_source_dir
          - ${var.landing_root}/green_taxi
          - --param
          - weather_source_dir
          - ${var.landing_root}/weather
          - --param
          - zones_source_dir
          - ${var.landing_root}/taxi_zones
          - --param
          - zone_file
          - ${var.zone_file}
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - bronze_schema
          - ${var.bronze_schema}
          - --param
          - quality_schema
          - ${var.quality_schema}
      - task_key: silver_taxi
        depends_on:
        - task_key: bronze
        spark_python_task:
          python_file: ./pipeline/02_silver/green_taxi_clean.py
          parameters:
          - --param
          - start_month
          - '{{tasks.bronze.values.start_month}}'
          - --param
          - end_month
          - '{{tasks.bronze.values.end_month}}'
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - bronze_schema
          - ${var.bronze_schema}
          - --param
          - silver_schema
          - ${var.silver_schema}
      - task_key: silver_weather
        depends_on:
        - task_key: silver_taxi
        spark_python_task:
          python_file: ./pipeline/02_silver/weather_clean.py
          parameters:
          - --param
          - start_month
          - '{{tasks.bronze.values.start_month}}'
          - --param
          - end_month
          - '{{tasks.bronze.values.end_month}}'
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - bronze_schema
          - ${var.bronze_schema}
          - --param
          - silver_schema
          - ${var.silver_schema}
      - task_key: silver_zones
        depends_on:
        - task_key: silver_weather
        spark_python_task:
          python_file: ./pipeline/02_silver/taxi_zones_clean.py
          parameters:
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - bronze_schema
          - ${var.bronze_schema}
          - --param
          - silver_schema
          - ${var.silver_schema}
      - task_key: taxi_quality
        depends_on:
        - task_key: silver_zones
        spark_python_task:
          python_file: ./pipeline/03_quality/green_taxi_quality.py
          parameters:
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - bronze_schema
          - ${var.bronze_schema}
          - --param
          - silver_schema
          - ${var.silver_schema}
      - task_key: zones_weather_quality
        depends_on:
        - task_key: taxi_quality
        spark_python_task:
          python_file: ./pipeline/03_quality/zones_weather_quality.py
          parameters:
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - silver_schema
          - ${var.silver_schema}
      - task_key: gold
        depends_on:
        - task_key: zones_weather_quality
        spark_python_task:
          python_file: ./pipeline/04_gold/gold_marts.py
          parameters:
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - silver_schema
          - ${var.silver_schema}
          - --param
          - gold_schema
          - ${var.gold_schema}
          - --param
          - max_valid_distance_miles
          - ${var.max_valid_distance_miles}
      - task_key: gold_quality
        depends_on:
        - task_key: gold
        spark_python_task:
          python_file: ./pipeline/04_gold/gold_quality.py
          parameters:
          - --param
          - catalog
          - ${var.catalog}
          - --param
          - silver_schema
          - ${var.silver_schema}
          - --param
          - gold_schema
          - ${var.gold_schema}
