bundle:
  name: nyc_mobility_pipeline

variables:
  catalog:
    default: nyc_mobility
  bronze_schema:
    default: nyc_bronze
  silver_schema:
    default: nyc_silver
  gold_schema:
    default: nyc_gold
  quality_schema:
    default: nyc_quality
  landing_root:
    default: /Volumes/nyc_mobility/nyc_bronze/ftw-b12-de-r2/groups/week-08/group-c/landing
  zone_file:
    default: taxi_zone_lookup.csv
  max_valid_distance_miles:
    default: "100"

targets:
  dev:
    default: true
    mode: development

resources:
  jobs:
    nyc_mobility:
      name: NYC Mobility
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_bronze/bronze_auto_ingest.py
            base_parameters:
              taxi_source_dir: ${var.landing_root}/green_taxi
              weather_source_dir: ${var.landing_root}/weather
              zones_source_dir: ${var.landing_root}/taxi_zones
              zone_file: ${var.zone_file}
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              quality_schema: ${var.quality_schema}
        - task_key: silver_taxi
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/03_silver/green_taxi_clean.py
            base_parameters:
              start_month: "{{tasks.bronze.values.start_month}}"
              end_month: "{{tasks.bronze.values.end_month}}"
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
        - task_key: silver_weather
          depends_on:
            - task_key: silver_taxi
          notebook_task:
            notebook_path: ./notebooks/03_silver/weather_clean.py
            base_parameters:
              start_month: "{{tasks.bronze.values.start_month}}"
              end_month: "{{tasks.bronze.values.end_month}}"
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
        - task_key: silver_zones
          depends_on:
            - task_key: silver_weather
          notebook_task:
            notebook_path: ./notebooks/03_silver/taxi_zones_clean.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
        - task_key: taxi_quality
          depends_on:
            - task_key: silver_zones
          notebook_task:
            notebook_path: ./notebooks/04_quality/green_taxi_quality.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
        - task_key: zones_weather_quality
          depends_on:
            - task_key: taxi_quality
          notebook_task:
            notebook_path: ./notebooks/04_quality/zones_weather_quality.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
        - task_key: gold
          depends_on:
            - task_key: zones_weather_quality
          notebook_task:
            notebook_path: ./notebooks/04_gold/gold_marts.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              max_valid_distance_miles: ${var.max_valid_distance_miles}
        - task_key: gold_quality
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ./notebooks/04_quality/gold_quality.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
